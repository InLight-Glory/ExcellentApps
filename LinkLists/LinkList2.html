<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LinkList</title>
    <style>
        :root{
            --white: #ffffff;
            --teal-950: #032a29;
            --teal-800: #115e59;
            --teal-700: #0f766e;
            --teal-600: #0d9488;
            --green-700: #15803d;
            --green-600: #16a34a;
            --bg: #f6fffb;
            --text: #062a25;
            --muted: #496a66;
            --border: rgba(3, 42, 41, 0.14);
            --shadow: 0 12px 35px rgba(3, 42, 41, 0.12);
            --radius: 14px;
        }

        *{ box-sizing: border-box; }

        html, body{
            height: 100%;
        }

        body{
            margin: 0;
            font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, "Apple Color Emoji", "Segoe UI Emoji";
            color: var(--text);
            background:
                radial-gradient(1200px 600px at 10% 0%, rgba(13, 148, 136, 0.16), transparent 60%),
                radial-gradient(1200px 600px at 95% 0%, rgba(22, 163, 74, 0.14), transparent 55%),
                var(--bg);
        }

        a{ color: inherit; text-decoration: none; }
        a:hover{ text-decoration: underline; }

        .app{
            max-width: 1200px;
            margin: 0 auto;
            padding: 18px 16px 40px;
        }

        .top{
            margin-bottom: 14px;
        }

        .topBar{
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            padding: 14px 14px;
            border: 1px solid var(--border);
            background: rgba(255,255,255,0.72);
            -webkit-backdrop-filter: blur(10px);
            backdrop-filter: blur(10px);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
        }

        .brand{
            display: flex;
            align-items: baseline;
            gap: 10px;
            font-weight: 800;
            letter-spacing: 0.2px;
        }

        .brandTitle{
            font-size: 18px;
        }

        .versionBadge{
            font-size: 12px;
            font-weight: 700;
            color: var(--teal-800);
            background: rgba(13, 148, 136, 0.12);
            border: 1px solid rgba(13, 148, 136, 0.22);
            padding: 4px 10px;
            border-radius: 999px;
        }

        .topActions{
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
            justify-content: flex-end;
        }

        .content{
            display: grid;
            grid-template-columns: 1fr 380px;
            gap: 14px;
            align-items: start;
        }

        .card{
            border: 1px solid var(--border);
            background: rgba(255,255,255,0.72);
            -webkit-backdrop-filter: blur(10px);
            backdrop-filter: blur(10px);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
        }

        .panelHeader{
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            padding: 14px 14px 10px;
            border-bottom: 1px solid rgba(3, 42, 41, 0.08);
        }

        .panelHeader.center{
            justify-content: center;
        }

        .panelHeader h2{
            margin: 0;
            font-size: 16px;
            letter-spacing: 0.2px;
        }

        .panelActions{
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        .main{
            grid-column: 1;
            overflow: hidden;
        }

        .main2{
            grid-column: 2;
            overflow: hidden;
        }

        .listContainer{
            padding: 12px 14px 14px;
        }

        .draggable{
            display: block;
        }

        .dragging{
            opacity: 0.6;
            filter: saturate(1.2);
        }

        .itemz{
            display: grid;
            grid-template-columns: auto auto 1fr auto auto;
            gap: 10px;
            align-items: start;
            padding: 10px;
            border: 1px solid rgba(3, 42, 41, 0.10);
            border-radius: 12px;
            background: rgba(255,255,255,0.85);
            margin-bottom: 10px;
        }

        .itemz:focus-within{
            border-color: rgba(13, 148, 136, 0.40);
            box-shadow: 0 0 0 4px rgba(13, 148, 136, 0.14);
        }

        textarea{
            width: 100%;
            resize: vertical;
            min-height: 64px;
            padding: 10px 10px;
            border-radius: 10px;
            border: 1px solid rgba(3, 42, 41, 0.16);
            background: rgba(255,255,255,0.92);
            font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
            font-size: 13px;
            line-height: 1.35;
            color: var(--teal-950);
            outline: none;
        }

        textarea:focus{
            border-color: rgba(13, 148, 136, 0.55);
            box-shadow: 0 0 0 4px rgba(13, 148, 136, 0.16);
        }

        .updowns{
            display: grid;
            gap: 6px;
        }

        .couClass{
            min-width: 2.6em;
            text-align: center;
            font-weight: 800;
            font-size: 12px;
            color: var(--teal-800);
            background: rgba(13, 148, 136, 0.12);
            border: 1px solid rgba(13, 148, 136, 0.22);
            border-radius: 999px;
            padding: 6px 10px;
            align-self: start;
        }

        .btn{
            appearance: none;
            border: 1px solid rgba(3, 42, 41, 0.18);
            background: var(--white);
            color: var(--teal-950);
            border-radius: 999px;
            padding: 9px 12px;
            font-weight: 800;
            font-size: 12px;
            letter-spacing: 0.2px;
            cursor: pointer;
            -webkit-user-select: none;
            user-select: none;
            transition: transform 110ms ease, background-color 110ms ease, border-color 110ms ease, box-shadow 110ms ease;
        }

        .hiddenFileInput{
            display: none;
        }

        .btn:hover{
            transform: translateY(-1px);
            border-color: rgba(13, 148, 136, 0.40);
            box-shadow: 0 8px 18px rgba(3, 42, 41, 0.08);
        }

        .btn:active{
            transform: translateY(0px);
        }

        .btn:focus-visible{
            outline: none;
            box-shadow: 0 0 0 4px rgba(13, 148, 136, 0.18);
        }

        .btn-ghost{
            background: rgba(255,255,255,0.70);
        }

        .btn-primary{
            background: linear-gradient(135deg, rgba(22, 163, 74, 0.18), rgba(13, 148, 136, 0.18));
            border-color: rgba(13, 148, 136, 0.30);
        }

        .btn-secondary{
            background: rgba(13, 148, 136, 0.12);
            border-color: rgba(13, 148, 136, 0.24);
            color: var(--teal-800);
        }

        .btn-danger{
            background: rgba(220, 38, 38, 0.08);
            border-color: rgba(220, 38, 38, 0.22);
            color: #b91c1c;
            font-size: 16px;
            line-height: 1;
            padding: 8px 12px;
        }

        .btn-icon{
            width: 38px;
            height: 34px;
            padding: 0;
            display: inline-grid;
            place-items: center;
            border-radius: 10px;
            font-weight: 900;
        }

        .arrow{
            border: solid var(--teal-950);
            border-width: 0 2px 2px 0;
            display: inline-block;
            padding: 3px;
        }

        .up{ transform: rotate(-135deg); }
        .down{ transform: rotate(45deg); }

        .itemME{
            display: grid;
            gap: 12px;
            padding: 12px 14px 14px;
        }

        .topItem{
            display: grid;
            grid-template-columns: 1fr auto;
            gap: 10px;
            align-items: start;
        }

        .panelFooter{
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-top: 6px;
        }

        .bottom{
            margin-top: 14px;
            padding: 14px;
            color: var(--muted);
        }

        .footerInner{
            display: flex;
            gap: 16px;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
        }

        details{
            color: var(--muted);
        }

        #xportDiag{
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(3, 42, 41, 0.55);
            padding: 20px;
            z-index: 999;
        }

        #xportDiag[aria-hidden="false"]{
            display: grid;
            place-items: center;
        }

        #xportDiag .modal{
            width: min(560px, 94vw);
            border-radius: var(--radius);
            border: 1px solid rgba(255,255,255,0.18);
            background: rgba(255,255,255,0.90);
            -webkit-backdrop-filter: blur(12px);
            backdrop-filter: blur(12px);
            box-shadow: 0 22px 80px rgba(3, 42, 41, 0.35);
            overflow: hidden;
        }

        #xportDiag .modalHeader{
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 14px 14px;
            border-bottom: 1px solid rgba(3, 42, 41, 0.10);
        }

        #xportDiag .modalHeader h1{
            margin: 0;
            font-size: 16px;
        }

        #xportDiag .modalBody{
            padding: 14px;
            display: grid;
            gap: 10px;
        }

        .exportRow{
            display: grid;
            grid-template-columns: 1fr;
            gap: 10px;
        }

        @media (max-width: 980px){
            .content{ grid-template-columns: 1fr; }
            .main, .main2{ grid-column: 1; }
        }

        @media (max-width: 560px){
            .itemz{ grid-template-columns: 1fr; }
            .couClass{ justify-self: start; }
            .panelFooter{ grid-template-columns: 1fr; }
        }
    </style>
    <script>
        function q$(selector){
            let q = document.querySelector(selector);
            return q;
        }

        function getListRoot(){
            return document.getElementById('listContainer');
        }

        function renumberItems(){
            const items = document.querySelectorAll('#listContainer .draggable');
            for (let i = 0; i < items.length; i++){
                const draggable = items[i];
                const itemz = draggable.querySelector('.itemz');
                const textarea = draggable.querySelector('textarea');
                const count = draggable.querySelector('.couClass');
                if (!itemz || !textarea || !count) continue;
                itemz.id = 'item' + i;
                textarea.id = 'inItem' + i;
                count.id = 'item' + i + 'count';
            }
        }

            // var x = document.getElementById(txt);
            var copyText = document.getElementById(txt);
            /* Select the text field */
            copyText.select();

            /* Copy the text inside the text field */

        function cleanTexts(tex,direction) {
            let search1, replaceWith1, search2, replaceWith2, search3, replaceWith3, search4, replaceWith4;
            if (direction == "in"){
                search1 = '|/~|';
                replaceWith1 = '|//~|';
                
                search2 = '(/~)';
                replaceWith2 = '(//~)';
                
                search3 = '|~|';
                replaceWith3 = '|/~|';
                
                search4 = '(~)';
                replaceWith4 = '(/~)';
            }else if (direction == "out"){
                search1 = '|/~|';
                replaceWith1 = '|~|';

                search2 = '(/~)';
                replaceWith2 = '(~)';
                
                search3 = '|//~|';
                replaceWith3 = '|/~|';
                
                search4 = '(//~)';
                replaceWith4 = '(/~)';
            }else {
                alert("fun.cleanTexts doesn't have a direction.");
                tex = "error";
                return tex;
            }
            try {
                tex = tex.replaceAll(search1 , replaceWith1);
            }catch (err){
                tex = tex;
            }
            try{
                tex = tex.replaceAll(search2 , replaceWith2);
            }catch (err){
                tex = tex;
            }
            try{
                tex = tex.replaceAll(search3 , replaceWith3);
            }catch (err) {
                tex = tex;
            }
            try {
                tex = tex.replaceAll(search4 , replaceWith4);
            }catch (err) {
                tex = tex;
            }
            return tex;
        }

        function encrypt(string) {
            string = unescape(encodeURIComponent(string));
            var newString = '',
                char, nextChar, combinedCharCode;
            for (var i = 0; i < string.length; i += 2) {
                char = string.charCodeAt(i);

                if ((i + 1) < string.length) {
                    nextChar = string.charCodeAt(i + 1) - 31;
                    combinedCharCode = char + "" + nextChar.toLocaleString('en', {
                        minimumIntegerDigits: 2
                    });
                    newString += String.fromCharCode(parseInt(combinedCharCode, 10));
                } else {
                    newString += string.charAt(i);
                }
            }
            return newString.split("").reduce((hex,c)=>hex+=c.charCodeAt(0).toString(16).padStart(4,"0"),"");
        }

        function decrypt(string) {

            var newString = '',
            char, codeStr, firstCharCode, lastCharCode;
            string = string.match(/.{1,4}/g).reduce((acc,char)=>acc+String.fromCharCode(parseInt(char, 16)),"");
            for (var i = 0; i < string.length; i++) {
            char = string.charCodeAt(i);
            if (char > 132) {
                codeStr = char.toString(10);

                firstCharCode = parseInt(codeStr.substring(0, codeStr.length - 2), 10);

                lastCharCode = parseInt(codeStr.substring(codeStr.length - 2, codeStr.length), 10) + 31;

                newString += String.fromCharCode(firstCharCode) + String.fromCharCode(lastCharCode);
            } else {
                newString += string.charAt(i);
            }
            }
            return newString;
        }

        function HumanDate(uni) {
            uni = uni.toString();
            uni = uni.slice(0, -3);
            uni = parseInt(uni);

            const milliseconds = uni * 1000; // 1575909015000
            const dateObject = new Date(milliseconds);
            const humanDateFormat = dateObject.toLocaleString(); //2019-12-9 10:30:15
            return humanDateFormat;
        }

        function Exportte() {
            var dateNowz = new Date().getTime();
            let Hdf = HumanDate(dateNowz);
            UpdateTopFive();
            
            var sFileName = prompt("Name the export here: ", Hdf+" Export");

            if (sFileName != null) {
                var txtAreaCount = document.querySelectorAll("textarea").length;
                var nTxt = document.getElementsByTagName("textarea");
                var nTcount = document.querySelectorAll(".couClass");
                var SaveTxt = ""; var cou, st1, st2;
                st1 = ""; st2 = "";
                for (var i=0; i < txtAreaCount; i++){
                    // console.log("i is "+i);
                    try {
                        cou = nTcount[i].textContent;
                        cou = cou.toString();
                    }
                    catch (err){
                        cou = undefined;
                    }
                    if (cou != undefined){
                        st1 += cleanTexts(nTxt[i].value,'in') + "|~|" + cleanTexts(nTcount[i].textContent, 'in') + "(~)";
                    }else {
                        st2 += cleanTexts(nTxt[i].value, 'in') + "|~|null(~)";
                    }
                }
                SaveTxt += dateNowz + "(~)|(~)" + st1 +"(~)|(~)"+ st2;
                var Tencrypted = encrypt(SaveTxt); 

                // console.log(SaveTxt);
                // Convert the text to BLOB.
                const textToBLOB = new Blob([Tencrypted], { type: 'text/plain' });
                // const sFileName = 'formData.txt';	   // The file to save the data.

                let newLink = document.createElement("a");
                newLink.download = sFileName;

                if (window.webkitURL != null) {
                    newLink.href = window.webkitURL.createObjectURL(textToBLOB);
                }
                else {
                    newLink.href = window.URL.createObjectURL(textToBLOB);
                    newLink.style.display = "none";
                    document.body.appendChild(newLink);
                }

                newLink.click();
            }
        }

        function Exporttx(){
            var dateNowz = new Date().getTime();
            let Hdf = HumanDate(dateNowz);
            UpdateTopFive();
            var sFileName = prompt("Name the export here: ", Hdf+" Export");

            if (sFileName != null) {

        function Importte(event) {
            var selectedFile = event.target.files[0];
            var reader = new FileReader();
            var RetTxt, Tdecrypted; 
            var result = document.getElementById("result");

            reader.onload = function(event) {
                RetTxt = event.target.result;
                Tdecrypted = decrypt(RetTxt);
                loadImport(Tdecrypted);
            };

        }
        
        function loadImport(savedInfo) {
            // console.log(savedInfo);
            var items = savedInfo.split("(~)|(~)");
                    document.title = HumanDate(items[0]);

                    var listAll = items[1].split("(~)"); var listload = "";
                    for (var i=0; i < listAll.length-1; i++){
                        var innerTx = listAll[i].split("|~|");
                        var safeText = cleanTexts(innerTx[0] ?? "", 'out');
                        var safeCount = cleanTexts(innerTx[1] ?? "0", 'out');
                        listload += `
<div class="draggable" draggable="true">
    <div class="itemz" id="item${i}">
        <button class="btn btn-secondary" type="button" onclick="txtCopy(this.closest('.itemz').querySelector('textarea').id, this.closest('.itemz').id)">Copy</button>

            <button class="btn btn-icon btn-ghost" type="button" onclick="MThis('top', this)" title="Move up"><i class="arrow up"></i></button>

    </div>
</div>`;
                    }
                    getListRoot().innerHTML = listload;

                        var item = listTop[i].split("|~|");
                        var lTop = cleanTexts(item[0] ?? "", 'out');
                        document.querySelector("#iItem"+onA).value = lTop;
                    }
        }

        function removeMe(nod){
            const item = document.getElementById(nod);
            if (!item) return;
            const draggable = item.closest('.draggable');
            if (draggable){
                draggable.remove();
            } else {
                item.remove();
            }
            renumberItems();
        }

        function itemTemplateS (num){
            if (num==null){num = 0;}
            return `
<div class="draggable" draggable="true">
    <div class="itemz" id="item${num}">
        <button class="btn btn-secondary" type="button" onclick="txtCopy(this.closest('.itemz').querySelector('textarea').id, this.closest('.itemz').id)">Copy</button>

        </div>

        <button class="btn btn-danger btn-icon" type="button" onclick="removeMe(this.closest('.itemz').id)" title="Remove">×</button>
        <div id="item${num}count" class="couClass">0</div>
    </div>
</div>`;
        }

                renumberItems();
                document.querySelector("#listContainer .draggable:nth-child(1) textarea").focus();

            }

        }

        var load = 0;

        function MThis(way, me){
            if (way == "top"){
                me.closest(".draggable").parentNode.insertBefore(me.closest(".draggable"), me.closest(".draggable").previousSibling);
            }
            if (way == "bot"){
                me.closest(".draggable").parentNode.insertBefore(me.closest(".draggable").nextSibling, me.closest(".draggable"));

            }
            renumberItems();
        }

         /**Now Drag to allow for dragging listed item*
            function nowDrag(){
                
                // var draggables = Array.from(document.getElementsByClassName("draggable"));
                // var containers = document.querySelectorAll(".container div:nth-child(1)");
                var draggables = document.querySelectorAll(".draggable");
                var containers = document.querySelectorAll(".container div");

                draggables.forEach(draggable =>{
                    draggable.addEventListener('dragstart', () =>{
                        draggable.classList.add("dragging");
                    })
                    draggable.addEventListener('dragend', () =>{
                        draggable.classList.remove("dragging");
                    })
                })

                containers.forEach(container => {
                    container.addEventListener('dragover', e => {
                        e.preventDefault();
                        var afterElement = getDragAfterElement(container, e.clientY);
                        var draggable = document.querySelector('.dragging');
                        if (afterElement == null){
                            console.log(afterElement);
                            container.appendChild(draggable);
                        } else {
                            container.insertBefore(draggable, afterElement);
                        }
                    })
                })

                function getDragAfterElement(container , y){
                    var draggableElements = [...container.querySelectorAll('.draggable:not(.dragging)')];

                    return draggableElements.reduce((closest, child) => {
                        var box = child.getBoundingClientRect();
                        console.log(box);
                        var offset = y - box.top - box.height / 2;
                        if (offset < 0 &&  offset > closest.offset){
                            return { offset: offset, element: child};
                        } else {
                            return closest;
                        }
                    }, { offset: Number.NEGATIVE_INIFINITY } ).element;
                }
                console.log("nowDrag ran");
            }

        /***/

        function CopyCounter(mine) {
            var oldCount = document.querySelector("#"+mine+"count");
            oldCount = parseInt(oldCount.textContent);
            var noe = document.querySelector("#"+mine+"count");
            noe.textContent = oldCount+1;
            UpdateTopFive();
        }
        
        function UpdateTopFive(){
            var five = [];
            var NumberCounts = document.querySelectorAll(".couClass").length;
            for (var i=1; i <= NumberCounts; i++){
                var q = i-1;
                var nu = document.getElementById("item"+q+"count").innerHTML;
                var obj ={"count" : parseInt(nu, 10) || 0 , "loc":"item"+q+"count"};
                five.push(obj);
            }
            
            five.sort(function (a, b) {
                return b.count - a.count;
            });
            for (var a=0; a < 5; a++){
                var onA = a+1;
                try{
                 //code that causes an error
                  var countEl = document.getElementById(five[a]['loc']);
                  var vvals = countEl.closest('.itemz').querySelector('textarea').value;
                }catch(e){
                    console.log("error occured");
                    // functionToHandleError(e);
                }
                if ((vvals == null)||(vvals=="")){
                    vvals = "()";
                }
                // console.log(vvals);
                document.querySelector("#iItem"+onA).value = vvals;
            }
        }

        // Without jQuery
        // Define a convenience method and use it
        var ready = (callback) => {
        if (document.readyState != "loading") callback();
        else document.addEventListener("DOMContentLoaded", callback);
        }

        ready(() => { 
        /* Do things after DOM has fully loaded */
        if (load == 0){
            // Start with one item.
            if (document.querySelectorAll('#listContainer .itemz').length === 0){
                appendItem('bot');
            }
            // nowDrag();
        }
        });
        
    </script>
</head>
<body>
    <div class="app">
        <header class="top">
            <div class="topBar">
                <div class="brand" aria-label="LinkList header">
                    <div class="brandTitle">LinkList</div>
                    <div class="versionBadge">Version 2.01</div>
                </div>
                <div class="topActions">
                    <button class="btn btn-ghost" type="button" onclick="window.location.href=window.location.href">New</button>
                    <a class="btn btn-ghost" onclick="this.href='data:text/html;charset=UTF-8,'+encodeURIComponent(document.documentElement.outerHTML)" href="#" download="LinkList.html">Download</a>
                </div>
            </div>
        </header>

        <main class="content">
            <section class="main container card" aria-label="Your list">
                <div class="panelHeader">
                    <h2>Your List</h2>
                    <div class="panelActions">
                        <button class="btn btn-primary" type="button" onclick="appendItem('top')">Add Top</button>
                        <button class="btn btn-primary" type="button" onclick="appendItem('bot')">Add Bottom</button>
                    </div>
                </div>
                <div id="listContainer" class="listContainer">
                    <!-- items injected by JS -->
                </div>
            </section>

            <aside class="main2 card" aria-label="Top five">
                <div class="panelHeader center">
                    <h2>Top 5</h2>
                </div>

                <div class='itemME' id='itemME' draggable='false'>
                    <div class="topItem">
                        <textarea id='iItem1' maxlength='99990' placeholder="Top item #1"></textarea>
                        <button class="btn btn-secondary" type="button" onclick='txtCopy(q$("#iItem1").id,"a")'>Copy</button>
                    </div>
                    <div class="topItem">
                        <textarea id='iItem2' maxlength='99990' placeholder="Top item #2"></textarea>
                        <button class="btn btn-secondary" type="button" onclick='txtCopy(q$("#iItem2").id,"a")'>Copy</button>
                    </div>
                    <div class="topItem">
                        <textarea id='iItem3' maxlength='99990' placeholder="Top item #3"></textarea>
                        <button class="btn btn-secondary" type="button" onclick='txtCopy(q$("#iItem3").id,"a")'>Copy</button>
                    </div>
                    <div class="topItem">
                        <textarea id='iItem4' maxlength='99990' placeholder="Top item #4"></textarea>
                        <button class="btn btn-secondary" type="button" onclick='txtCopy(q$("#iItem4").id,"a")'>Copy</button>
                    </div>
                    <div class="topItem">
                        <textarea id='iItem5' maxlength='99990' placeholder="Top item #5"></textarea>
                        <button class="btn btn-secondary" type="button" onclick='txtCopy(q$("#iItem5").id,"a")'>Copy</button>
                    </div>

                    <div class="panelFooter">
                        <button class="btn btn-primary" type="button" onclick="showExport()">Export</button>

                        <input id='ipo' class="hiddenFileInput" type="file" value="Import" onchange="Importte(event)">
                        <button class="btn btn-secondary" type="button" onclick="startImport()">Import</button>
                    </div>
                </div>
            </aside>
        </main>

        <footer class="bottom card">
            <div class="footerInner">
                <div>Created by: Aquil Roberts</div>
                <details>
                    <summary>Features to come</summary>
                    <div>- adding tab-pages ?</div>
                </details>
            </div>
        </footer>

        <div id="xportDiag" aria-hidden="true">
            <div class="modal" role="dialog" aria-label="Export options">
                <div class="modalHeader">
                    <h1>Export</h1>
                    <button class="btn btn-ghost" type="button" onclick="hideExport()">Close</button>
                </div>
                <div class="modalBody">
                    <div class="exportRow">
                        <button class="btn btn-primary" type="button" onclick="hideExport();Exportte()">Encrypted</button>
                        <button class="btn btn-primary" type="button" onclick="hideExport();Exportth()">Simple</button>
                        <button class="btn btn-primary" type="button" onclick="hideExport();Exporttx()">Excel (.csv)</button>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script>
        function showExport(){
            const d = document.getElementById("xportDiag");
            d.setAttribute('aria-hidden', 'false');
        }
        function hideExport(){
            const d = document.getElementById("xportDiag");
            d.setAttribute('aria-hidden', 'true');
        }
    </script>
</body>
</html>
